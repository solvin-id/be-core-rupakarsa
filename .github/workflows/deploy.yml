name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm prune --omit=dev

      - name: Stage
        run: |
          mkdir -p "$RUNNER_TEMP/stage"
          rsync -a --exclude '.git' --exclude 'src' --exclude 'tests' --exclude '.env' ./ "$RUNNER_TEMP/stage/"

      - name: Configure SSH
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload stage
        run: rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" "$RUNNER_TEMP/stage/" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/srv/rupakarsa-stage/"

      - name: Deploy
        run: ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'sudo -n /usr/local/bin/rupakarsa-ci-deploy /srv/rupakarsa-stage'

      - name: Verify
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'curl -fsS -m 5 http://127.0.0.1:8787/health' | tee health.json
          grep -q '"status":"ok"' health.json
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'systemctl is-active rupakarsa-api.service rupakarsa-worker.service'
