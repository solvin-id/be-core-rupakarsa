services:
  db:
    image: postgres:16-alpine
    container_name: rupakarsa-db
    environment:
      POSTGRES_USER: rupakarsa
      POSTGRES_PASSWORD: rupakarsa
      POSTGRES_DB: rupakarsa
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rupakarsa -d rupakarsa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rupakarsa-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
  redisdata:
