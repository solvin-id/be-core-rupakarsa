skip_clone: true
labels:
  backend: local

steps:
  - name: clone
    image: bash
    commands:
      - git clone -b "$CI_COMMIT_BRANCH" https://github.com/solvin-id/be-core-rupakarsa.git .
      - git checkout "$CI_COMMIT_SHA"
    when:
      event: [push, manual]
      branch: [master]

  - name: build
    image: bash
    commands:
      - export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
      - export npm_config_cache="/home/woodpecker/caches/npm-cache"
      - mkdir -p "$npm_config_cache"
      - node -v && npm -v
      - npm ci
      - npm run typecheck && npm run lint && npm run build
      - npm prune --omit=dev
    when:
      event: [push, manual]
      branch: [master]

  - name: deploy
    image: bash
    commands:
      - test "$CI_COMMIT_BRANCH" = "master" || { echo "refusing to deploy from $CI_COMMIT_BRANCH"; exit 1; }
      - sudo -n /usr/local/bin/rupakarsa-ci-deploy "$PWD"
    when:
      event: [push, manual]
      branch: [master]

  - name: verify
    image: bash
    commands:
      - export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
      - curl -fsS -m 5 http://127.0.0.1:8787/health | tee /tmp/rk-health.json
      - grep -q '"status":"ok"' /tmp/rk-health.json
      - systemctl is-active rupakarsa-api.service
      - systemctl is-active rupakarsa-worker.service
    when:
      event: [push, manual]
      branch: [master]
